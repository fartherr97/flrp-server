<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="win">
      <header class="hd">
        <img id="logo" class="logo" alt="" />
        <div>
          <div class="hd-name">Server Duty System</div>
          <div class="hd-sub" id="hd-sub">Florida Roleplay</div>
        </div>
        <button class="icon-btn" id="btn-close" title="Close (Esc)">✕</button>
      </header>
      <nav class="tabs"><button class="tab active" id="tab-duty" data-view="duty">Duty</button><button class="tab" id="tab-units" data-view="units">Units</button></nav>
      <main class="body" id="body"></main>
      <footer class="ft"><span>Press <kbd id="ft-key">F6</kbd> or <b>/duty</b> to toggle · <kbd>Esc</kbd> to close</span></footer>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
