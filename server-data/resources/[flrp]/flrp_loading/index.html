<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florida Roleplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poiret+One&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0A1626; --deep:#122a44; --purple:#3a2760;
    --flamingo:#FF5C8A; --gold:#FFAB5E; --aqua:#3FE0D0;
    --sand:#F5E8D0; --ink:#050d18;
    --frame:rgba(245,232,208,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--sand);
    font-family:"Barlow Condensed",system-ui,sans-serif;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  /* palm silhouettes */
  .palm{position:fixed;bottom:-8px;z-index:1;height:62vh;filter:drop-shadow(0 0 24px rgba(0,0,0,.5));
    transform-origin:bottom center;color:var(--ink)}
  .palm.left{left:-4vw;transform:scaleX(-1) rotate(1.5deg);animation:sway 9s ease-in-out infinite}
  .palm.right{right:-3vw;height:70vh;animation:sway 11s ease-in-out infinite reverse}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
  .palm.left{animation-name:swayL}
  @keyframes swayL{0%,100%{transform:scaleX(-1) rotate(-1.4deg)}50%{transform:scaleX(-1) rotate(1.2deg)}}

  /* foreground stage */
  .stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:clamp(18px,3.2vh,34px);padding:6vh 4vw}

  .frame{position:relative;padding:clamp(22px,4vh,42px) clamp(30px,6vw,90px);
    display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,18px)}
  /* deco double-rule frame with stepped corners */
  .frame::before,.frame::after{content:"";position:absolute;inset:0;pointer-events:none}
  .frame::before{border:1px solid var(--frame);
    clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
  .frame::after{inset:7px;border:1px solid rgba(63,224,208,.35)}

  .logo{height:clamp(72px,12vh,132px);width:auto;object-fit:contain;
    filter:drop-shadow(0 6px 26px rgba(255,92,138,.45));}
  .logo.hide{display:none}

  .eyebrow{font-family:"Poiret One",serif;letter-spacing:.55em;text-indent:.55em;
    font-size:clamp(12px,1.7vh,17px);color:var(--aqua);text-transform:uppercase}

  .wordmark{font-family:"Anton",Impact,sans-serif;text-transform:uppercase;
    font-size:clamp(46px,10.2vh,120px);line-height:.86;letter-spacing:.02em;text-wrap:balance;
    color:var(--sand);
    text-shadow:0 0 1px var(--sand), 0 0 18px rgba(255,92,138,.55), 0 0 42px rgba(255,92,138,.35), 0 4px 0 rgba(5,13,24,.4);}
  .wordmark span{color:var(--flamingo);
    text-shadow:0 0 18px rgba(255,92,138,.75),0 0 44px rgba(255,92,138,.45)}

  .depts{display:flex;align-items:center;gap:clamp(12px,2vw,26px);margin-top:2px}
  .depts b{font-family:"Poiret One",serif;font-weight:400;letter-spacing:.32em;text-indent:.32em;
    font-size:clamp(13px,1.9vh,20px);color:var(--sand);opacity:.92}
  .depts i{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);
    box-shadow:0 0 10px var(--gold)}

  /* loader */
  .loader{width:min(560px,74vw);display:flex;flex-direction:column;gap:9px}
  .bar{height:5px;border-radius:99px;background:rgba(245,232,208,.14);overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(63,224,208,.18)}
  .fill{height:100%;width:6%;border-radius:99px;
    background:linear-gradient(90deg,var(--aqua),var(--flamingo) 60%,var(--gold));
    box-shadow:0 0 14px rgba(255,92,138,.6);transition:width .5s cubic-bezier(.4,.9,.3,1)}
  .status{display:flex;justify-content:space-between;align-items:baseline;
    font-size:clamp(12px,1.6vh,15px);letter-spacing:.14em;text-transform:uppercase;color:rgba(245,232,208,.7)}
  #pct{font-variant-numeric:tabular-nums;color:var(--aqua)}
  #tip{max-width:70%;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    transition:opacity .5s}

  .foot{position:fixed;left:0;right:0;bottom:clamp(12px,2.4vh,22px);z-index:3;text-align:center;
    font-size:clamp(11px,1.5vh,14px);letter-spacing:.34em;text-transform:uppercase;color:rgba(63,224,208,.6)}
  .foot b{color:var(--flamingo);font-weight:400}

  /* vignette + faint deco scanline for depth */
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%,transparent 40%,rgba(5,13,24,.55) 100%)}

  @media (prefers-reduced-motion: reduce){
    .palm{animation:none!important}
    .fill{transition:none}
  }
</style>
</head>
<body>
  <!-- Background music. Drop a royalty-free track named bgm.ogg into this
       resource folder (see fxmanifest.lua). Missing file = silent, no error. -->
  <audio id="bgm" src="bgm.ogg" loop preload="auto"></audio>

  <canvas id="scene"></canvas>

  <!-- palm silhouettes (moderate paths, mirrored) -->
  <svg class="palm left" viewBox="0 0 300 620" fill="currentColor" aria-hidden="true"><path d="M148 620c-6-150-14-300-30-430 22 14 46 40 60 74 2-40-6-86-34-120 34 8 70 34 88 74 6-40-4-92-40-128 40 4 86 30 106 78 10-42 4-96-30-140 46 12 92 48 104 108 8-26 8-64-8-98 40 26 66 74 62 132-2 26-10 46-10 46s-40-30-92-34c26 18 46 44 54 78-40-26-86-40-130-36 30 16 56 42 68 80-44-30-96-44-146-36 12 118 20 268 24 428z"/></svg>
  <svg class="palm right" viewBox="0 0 300 620" fill="currentColor" aria-hidden="true"><path d="M148 620c-6-150-14-300-30-430 22 14 46 40 60 74 2-40-6-86-34-120 34 8 70 34 88 74 6-40-4-92-40-128 40 4 86 30 106 78 10-42 4-96-30-140 46 12 92 48 104 108 8-26 8-64-8-98 40 26 66 74 62 132-2 26-10 46-10 46s-40-30-92-34c26 18 46 44 54 78-40-26-86-40-130-36 30 16 56 42 68 80-44-30-96-44-146-36 12 118 20 268 24 428z"/></svg>

  <div class="grain"></div>

  <main class="stage">
    <div class="frame">
      <img class="logo" id="logo" src="https://www.flrp.us/images/c8452f76261f8e9c.png" alt="Florida Roleplay">
      <div class="eyebrow">South Miami &middot; Florida</div>
      <h1 class="wordmark">Florida <span>Roleplay</span></h1>
      <div class="depts"><b>BCSO</b><i></i><b>FHP</b><i></i><b>MPD</b></div>
    </div>

    <div class="loader">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="status"><span id="pct">0%</span><span id="tip">Warming up the strip&hellip;</span></div>
    </div>
  </main>

  <footer class="foot">flrp.us &nbsp;&middot;&nbsp; <b>Now boarding in South Beach</b></footer>

<script>
(() => {
  // background music — fade in gently; stays silent + error-free if bgm.ogg is absent
  const bgm = document.getElementById('bgm');
  if (bgm) {
    bgm.volume = 0;
    const tryPlay = () => (bgm.play ? bgm.play().catch(() => {}) : null);
    tryPlay();
    bgm.addEventListener('canplay', () => {
      tryPlay();
      let v = 0; const fade = setInterval(() => { v = Math.min(0.35, v + 0.02); bgm.volume = v; if (v >= 0.35) clearInterval(fade); }, 120);
    });
  }

  const c = document.getElementById('scene'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR;
  function size(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = c.width  = Math.floor(innerWidth  * DPR);
    H = c.height = Math.floor(innerHeight * DPR);
  }
  size(); addEventListener('resize', size);

  // hide logo if it fails to load
  const logo = document.getElementById('logo');
  logo.addEventListener('error', () => logo.classList.add('hide'));

  const stop = (grad, list) => list.forEach(([o,col]) => grad.addColorStop(o, col));

  function draw(t){
    const w = W, h = H, horizon = h * 0.80;
    // sky
    const sky = x.createLinearGradient(0,0,0,horizon);
    stop(sky, [[0,'#0A1626'],[0.42,'#20204a'],[0.66,'#5b2b63'],[0.83,'#c8446f'],[1,'#ff8a5c']]);
    x.fillStyle = sky; x.fillRect(0,0,w,horizon);

    const cx = w*0.5, cy = horizon, R = Math.min(w*0.17, h*0.30);
    const pulse = reduce ? 1 : 1 + Math.sin(t/1400)*0.03;

    // deco sunburst rays behind the sun
    x.save(); x.translate(cx,cy);
    const rays = 40, sweep = reduce ? 0 : (t/26000);
    for(let i=0;i<rays;i++){
      const a = (i/rays)*Math.PI*2 + sweep;
      const len = R*3.4, wdt = (i%2? 0.010: 0.020);
      x.beginPath(); x.moveTo(0,0);
      x.lineTo(Math.cos(a-wdt)*len, Math.sin(a-wdt)*len);
      x.lineTo(Math.cos(a+wdt)*len, Math.sin(a+wdt)*len);
      x.closePath();
      x.fillStyle = i%2 ? 'rgba(255,171,94,0.05)' : 'rgba(255,92,138,0.07)';
      x.fill();
    }
    x.restore();

    // sun glow
    const glow = x.createRadialGradient(cx,cy,R*0.2,cx,cy,R*2.4);
    stop(glow,[[0,'rgba(255,140,120,0.55)'],[0.4,'rgba(255,92,138,0.22)'],[1,'rgba(255,92,138,0)']]);
    x.fillStyle = glow; x.beginPath(); x.arc(cx,cy,R*2.4,0,7); x.fill();

    // sun disc
    const disc = x.createLinearGradient(0,cy-R,0,cy+R);
    stop(disc,[[0,'#FFE39A'],[0.45,'#FFAB5E'],[1,'#FF5C8A']]);
    x.save();
    x.beginPath(); x.arc(cx,cy,R*pulse,0,7); x.clip();
    x.fillStyle = disc; x.fillRect(cx-R*1.2, cy-R*1.2, R*2.4, R*2.4);
    // synthwave slats on the lower third of the sun
    x.fillStyle = '#0A1626';
    for(let i=0;i<7;i++){
      const yy = cy + R*0.18 + i*(R*0.13);
      const hh = (R*0.045) + i*(R*0.012);
      x.fillRect(cx-R*1.2, yy, R*2.4, hh);
    }
    x.restore();

    // ocean
    const sea = x.createLinearGradient(0,horizon,0,h);
    stop(sea,[[0,'#2a123a'],[0.25,'#12233f'],[1,'#080f1c']]);
    x.fillStyle = sea; x.fillRect(0,horizon,w,h-horizon);

    // neon aqua horizon line
    x.fillStyle = 'rgba(63,224,208,0.9)';
    x.fillRect(0, horizon-1*DPR, w, 2*DPR);
    x.fillStyle = 'rgba(63,224,208,0.18)';
    x.fillRect(0, horizon-6*DPR, w, 12*DPR);

    // shimmering reflection of the sun on the water
    const cols = 26;
    for(let i=0;i<cols;i++){
      const yy = horizon + (i/cols)*(h-horizon);
      const wob = reduce ? 0 : Math.sin(t/500 + i*0.7) * (R*0.05*(i/cols));
      const rw = R*(0.9 - i*0.02);
      const alpha = 0.30 * (1 - i/cols);
      x.fillStyle = `rgba(255,150,120,${Math.max(alpha,0)})`;
      x.fillRect(cx-rw+wob, yy, rw*2, (h-horizon)/cols*0.55);
    }
  }

  let raf;
  function loop(t){ draw(t); raf = requestAnimationFrame(loop); }
  if(reduce){ draw(0); } else { raf = requestAnimationFrame(loop); }

  // ---- progress + tips -------------------------------------------------
  const fill = document.getElementById('fill'), pct = document.getElementById('pct'), tipEl = document.getElementById('tip');
  let shown = 6, fromEngine = false, fake = 6;

  const tips = [
    "Only verified members of the FLRP Discord get past the gate.",
    "BCSO patrols the county — FHP owns the highways — MPD runs the city.",
    "Deputies, troopers & officers pull their loadout by going on /duty.",
    "No weapon in your holster? Cert up, or buy legit at a gun store.",
    "Drive like the cameras are rolling. Because the bodycams are.",
    "New here? Read the rules and pick a lane — civ, county, or badge.",
    "Miami never sleeps and neither does dispatch."
  ];
  let ti = Math.floor(Math.random()*tips.length);
  tipEl.textContent = tips[ti];
  setInterval(() => {
    ti = (ti+1) % tips.length;
    tipEl.style.opacity = 0;
    setTimeout(() => { tipEl.textContent = tips[ti]; tipEl.style.opacity = 1; }, 500);
  }, 4200);

  function set(p){
    p = Math.max(0, Math.min(100, p));
    shown = p; fill.style.width = p + '%'; pct.textContent = Math.round(p) + '%';
  }
  set(6);

  // gentle fake creep until the engine reports real progress (also drives the preview)
  const creep = setInterval(() => {
    if(fromEngine) return clearInterval(creep);
    fake = Math.min(fake + Math.random()*4, 92);
    set(fake);
  }, 650);

  // FiveM loading-screen events
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if(d.eventName === 'loadProgress' && typeof d.loadFraction === 'number'){
      fromEngine = true; set(d.loadFraction * 100);
    }
    if(d.eventName === 'startInitFunctionOrder' || d.eventName === 'startDataFileEntries'){ fromEngine = true; }
  });
})();
</script>
</body>
</html>
