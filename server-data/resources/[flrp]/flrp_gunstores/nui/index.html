<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLRP Gun Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root" class="hidden">
    <div class="panel">
      <header class="panel-header">
        <div>
          <h1 id="store-label">Gun Store</h1>
          <p class="subtitle">Florida Roleplay</p>
        </div>
        <div class="balance">
          <span class="balance-label">Balance</span>
          <span id="balance" class="balance-value">$0</span>
        </div>
        <button id="close" class="close-btn" title="Close">&times;</button>
      </header>

      <div id="notice" class="notice hidden"></div>

      <ul id="catalog" class="catalog"></ul>

      <footer class="panel-footer">
        <span class="hint">Prices are validated by the server at purchase.</span>
      </footer>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
