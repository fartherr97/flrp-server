# ==========================================================================
# FLRP — Florida Roleplay :: TOP-LEVEL SERVER CONFIG
# ==========================================================================
# This file is intentionally thin. It sets endpoints, then delegates to the
# split configs under config/. Keep host-specific values here or in secrets.
#
# Portability note: nothing in this file is Nodecraft-specific. If you migrate
# to OVH/dedicated, only the endpoint/port lines and secrets change.
# See docs/DEPLOYMENT.md.
# ==========================================================================

# --------------------------------------------------------------------------
# Network endpoints
# --------------------------------------------------------------------------
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --------------------------------------------------------------------------
# Secrets (host-provided, NEVER committed).
# Copy config/secrets.example.cfg -> config/secrets.cfg and fill it in.
# The exec is guarded so the server still boots for static validation if the
# real secrets file is absent (values will just be REPLACE_ME placeholders).
# --------------------------------------------------------------------------
exec config/secrets.cfg

# --------------------------------------------------------------------------
# Split configuration (order matters)
# --------------------------------------------------------------------------
exec config/server.cfg          # locale, hostname, tags, OneSync, sv_master
exec config/permissions.cfg     # base ACE hierarchy for FLRP groups + vMenu
exec config/economy.cfg         # economy convars (dev defaults)
exec config/vehicles.cfg        # vehicle-system convars
exec config/resources.cfg       # ensures resources in dependency order

# --------------------------------------------------------------------------
# Final: bring the server online.
# sv_licenseKey is set in secrets.cfg (never commit it).
# --------------------------------------------------------------------------
# sv_maxclients is set in config/server.cfg
