# ==========================================================================
# FLRP :: config/server.cfg — general server settings
# ==========================================================================
# General, portable server settings. No secrets here.
# ==========================================================================

# --- Identity -------------------------------------------------------------
sv_hostname "🌴 Florida Roleplay | FLRP | Miami RP | BSO · FHP · MPD"
sets sv_projectName "Florida Roleplay"
sets sv_projectDesc "Serious Miami-based roleplay · BSO · FHP · MPD · persistent economy"
sets tags "roleplay, miami, florida, police, vMenu, economy, whitelist, FLRP"

# --- Server-list branding -------------------------------------------------
# load_server_icon: the little icon shown next to the name in the FiveM server
# browser. It MUST be a 96x96 PNG. Drop the FLRP logo (resized to 96x96) at
# server-data/logo.png and this loads it. (Left active; if the file is missing
# FiveM logs one harmless warning at boot.)
load_server_icon logo.png

# Banners shown on the server's detail page and while connecting. These are
# loaded from the internet by the client, so a URL is fine. Pointed at the FLRP
# logo for now — swap to a proper wide banner (~1900x300 PNG/JPG) when you have
# one, e.g. hosted at flrp.us.
sets banner_detail "https://www.flrp.us/images/0cf4f7264d435b3b.png"
sets banner_connecting "https://www.flrp.us/images/0cf4f7264d435b3b.png"

# --- Info-panel links (shown on the right when a player clicks the server) --
sets Discord "https://discord.gg/floridarp"
sets website "https://www.flrp.us"
sets Owners "Jordan, Mike, Johnson"

# --- Locale ---------------------------------------------------------------
sets locale "en-US"
set sv_enforceGameBuild 3258            # bump as needed for imported assets

# --- Capacity -------------------------------------------------------------
sv_maxclients 64                        # portable, raise on dedicated hardware

# --- OneSync (required for modern population / entity ownership) ----------
# OneSync MUST be enabled, but it is set OUTSIDE this file:
#   - txAdmin: Settings -> set OneSync to "on (infinity)". txAdmin edits any cfg
#     that sets onesync here, which conflicts with git pull, so we do NOT set it
#     in this tracked file.
#   - Bare (no txAdmin): pass it as a launch arg, e.g. `+set onesync on`, or set
#     it in a separate untracked launch cfg.
# Do NOT add `set onesync ...` lines here.

# --- Scripthook (disable on production for security) ----------------------
sv_scriptHookAllowed 0

# --- Server list / master -------------------------------------------------
sv_master1 ""                           # default master, leave empty for default
# sv_licenseKey is provided via secrets.cfg (host-specific, never committed)

# --- Steam (optional, identity does NOT depend on Steam, see flrp_access) --
# set steam_webApiKey "REPLACE_ME"      # optional, provided via secrets.cfg

# --- HTTP / API -----------------------------------------------------------
# flrp_api registers its own HTTP handlers, no extra config required here.

# --- Logging / performance ------------------------------------------------
set sv_requestParanoia 3
