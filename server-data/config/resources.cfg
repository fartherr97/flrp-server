# ==========================================================================
# FLRP :: config/resources.cfg — resource start order
# ==========================================================================
# Order matters. Dependencies -> core -> flrp services -> departments ->
# assets. FLRP resources declare `dependency`/`dependencies` in their
# fxmanifest, but explicit ordering here keeps boot deterministic.
#
# Vehicle categories are started below; maps and EUP retain explicit startup order.
# ==========================================================================

# --------------------------------------------------------------------------
# 1. Dependencies (installed per-host into [dependencies])
# --------------------------------------------------------------------------
ensure oxmysql

# --------------------------------------------------------------------------
# 2. Core community resources ([core]) — vMenu.
#    FLRP is self-contained: it runs its OWN Discord connection gate
#    (flrp_access) and permission engine (flrp_permissions). No pCore.
# --------------------------------------------------------------------------
ensure vMenu            # enforce weapon policy, requires setr vmenu_use_permissions true (permissions.cfg)
ensure delveh           # delete-vehicle utility (installed on the server, not in git)
ensure wk_wars2x        # Wraith ARS 2X police radar + plate reader (MIT, vendored in [standalone])

# --------------------------------------------------------------------------
# 2b. FiveM base gameplay resources (from cfx-server-data, dropped into
#     resources/). Without a session/spawn manager a connecting player hangs on
#     "Awaiting scripts". basic-gamemode is a TEMPORARY auto-spawn, once
#     flrp-scripts (nex-spawn) is cloned in, remove basic-gamemode and ensure
#     nex-spawn instead.
# --------------------------------------------------------------------------
ensure baseevents
ensure chat
ensure sessionmanager
ensure mapmanager
ensure spawnmanager
ensure hardcap
# ensure basic-gamemode     # not needed — flrp_spawn (section 3) is the spawn manager

# --------------------------------------------------------------------------
# 3. FLRP custom services (dependency order)
#    flrp_core must start first, everything else depends on it.
#    flrp_access runs the Discord-gated connection deferral and hands the
#    player's Discord roles to flrp_permissions.
# --------------------------------------------------------------------------
ensure flrp_core
ensure flrp_hotreload       # applies autodeploy changes live (no-kick reloads), keep near the top
ensure flrp_logs            # Discord webhook logging (SSRP-style embeds), webhooks in secrets.cfg
ensure flrp_chatfilter      # slur filter: block chat + auto-kick + staff ping (used by flrp_chat/flrp_messages)
ensure flrp_chatbridge      # in-game chat <-> Discord #ingame-chat (webhook out, bot -> flrp_api in)
ensure flrp_permissions
ensure flrp_access
ensure flrp_economy
ensure flrp_duty            # read-only adapter over flrp_onduty's registry (dept pay, counters)
ensure flrp_onduty          # FLRP duty system: /duty menu, callsigns, ranks, loadouts
ensure flrp_weapons
ensure flrp_vehicles
ensure flrp_gunstores
ensure flrp_api
ensure flrp_playermeta      # pushes players table (playtime, first/last seen) to the website /bgcheck embed
ensure flrp_spawn           # FLRP spawn selector (open replacement for nex-spawn), needs spawnmanager
ensure flrp_dutycounter     # on-duty HUD counter (LEO from flrp_onduty, Staff via /vest)
ensure flrp_status          # live server-status Discord embed (webhook in secrets.cfg)
ensure flrp_notify          # nex-styled join/leave toasts (replaces native vMenu ones)
ensure flrp_no_peds         # no wandering NPC peds, keeps AI traffic vehicles
ensure flrp_pvp             # player-vs-player damage ON (friendly fire), kill switch: setr flrp_pvp "false"
ensure flrp_leoblips        # dept-coloured map blips for on-duty LEO (after flrp_duty)
ensure flrp_reports         # /report + /calladmin, J-key staff console, claims, analytics
ensure flrp_jail            # /jail manager: jail + hospitalize + LEO hospitalize (needs flrp_core DB)
ensure flrp_greenzone       # safe zones: /greenzones ownership manager (needs flrp_core DB)
ensure flrp_staffactivity   # vest-hours + claims -> SSRP-style Discord activity tracker
ensure flrp_txdiscipline    # txAdmin bans/kicks/warns -> Discord (webhook in secrets.cfg)
ensure flrp_death           # death timer + respawn (key) + /revive, no voice while dead
ensure flrp_leotools        # LEO restraint tools: cuff / drag / seat (flrp.leo, used by flrp_interact)
ensure flrp_interact        # "M" interaction menu: toolboxes, donator vehicles, advertisements
ensure flrp_fullauto        # semi-auto lock: full-auto only for Ownership/Director + SWAT (flrp.fullauto)
ensure flrp_tempid          # LEO Temp ID: keybind reveals nearby player IDs overhead (5s) -> #temp-id-logs
ensure flrp_vmenulog        # logs vMenu time/weather changes + vehicle repairs -> #time-weather / #repair logs
ensure flrp_messages        # in-game PM system (/pm) + staff monitor + Discord logging (category pm)
ensure flrp_vote            # /startvote: full-screen server-wide votes (AOP, polls), staff-started

# --------------------------------------------------------------------------
# 4. Departments (BSO / FHP / MPD department-specific glue)
# --------------------------------------------------------------------------
# ensure flrp_bso        # populated as department resources are built
# ensure flrp_fhp
# ensure flrp_mpd

# ---- Vehicles: category startup -------------------------------------------
# flrp-vehicles preserves department folders under Emergency Services.
# Escrow packs retain their identities; plain packs are consolidated.
ensure "[Civilian]"
ensure "[Emergency Services]"
ensure "[Donator]"
# Staff was not previously enabled. Start its category when desired:
# ensure "[Staff]"
# Conflicting FHP/staff alternatives are preserved in _optional, not discovered.

# --------------------------------------------------------------------------
# 5. Content — third-party scripts (from flrp-scripts, synced by
#    deploy/sync-content.sh into resources/[scripts]). Only resources whose
#    dependencies are present are ensured, the rest are listed but commented
#    with the dependency they still need.
# --------------------------------------------------------------------------
ensure PolyZone             # zone library — REQUIRED by nex-hud (@PolyZone/client.lua), load first
ensure nex-loading          # loading screen (customised for FLRP in flrp-scripts/nex-loading/ui)
ensure nex-hud              # HUD
# ensure nex-duty           # RETIRED — escrowed, /duty never saved (go_on_duty not net-safe). Replaced by flrp_onduty.
ensure SmartTaser           # standalone taser
ensure Breathalyzer         # LEO breathalyzer (escrow). /bacseat opens the device, the tested player answers /bac.
                            # Command mode is enabled in its config.lua (no ox_inventory here), incl. the self-set BAC command for RP
ensure scullysling          # weapon sling on the player model (escrow, standalone mode). /sling opens the positioning UI, needs oxmysql + OneSync
# ULC starts after the vehicle packs in section 5c; its loader rejects stopped resources.
ensure RageUI               # menu library — REQUIRED by lvc, load first
ensure lvc                  # Luxart Vehicle Control siren/lights (folder MUST be 'lvc')
ensure ox_lib               # library — REQUIRED by jg-handling (@ox_lib) + prison interiors, load first
ensure jg-handling          # JG Advanced Handling Editor (needs oxmysql + ox_lib, makes its own table)
ensure flrp_chat            # Discord-colored staff names + gated /sc /ac /dc channels
ensure oulsen_satmap        # satellite minimap + world map replacement (streams tiles)
ensure flrp_postal          # /p <postal> -> GPS waypoint (reads oulsen_satmap postals)

# SonoranCAD — started via ITS OWN cfg (NOT `ensure`), that one exec pulls in
# sonorancad + all bundled plugins. The `@sonorancad/...` path resolves once the
# [sonorancad] resource is assembled from flrp-scripts. Must load BEFORE the
# sonoran-* resources below that depend on it.
exec @sonorancad/sonorancad.cfg

# Sonoran Radio — started via ITS OWN cfg (NOT `ensure`), the way Sonoran ships it:
# the cfg sets the API-key convar protection, grants the unsafe-child-process
# permission its node auto-updater needs, adds the resource ACEs, and ensures
# sonoranradio. The updatehelper resource is started on demand by the updater, so
# it only needs to be present ([scripts]/sonoranradio_updatehelper), never ensured.
exec @sonoranradio/sonoranradio.cfg

# --- nex-spawn: RETIRED. Its spawn click never fired in-game despite loading
#     clean, escrow granted, PolyZone present and OneSync on — and its server is
#     escrow-locked so it can't be debugged. Replaced by flrp_spawn (section 3),
#     an open selector with the same location picker + LEO ace gating. ---
# ensure nex-spawn

# --- Need an external dependency not yet installed — enable once added: ---
# ensure cd_doorlock        # needs cd_bridge
# ensure sonoran-radar      # needs wk_wars2x (it starts sonoran-radar_helper itself)
# ensure smartsigns_sonoran # needs SonoranCAD
# ensure lb-phone           # needs lb-phone DB import + config
# ensure lb-phoneprop       # needs lb-phone
# NOTE: never ensure sonoran-radar_helper (internal to sonoran-radar),
#       never ensure pCore (dropped — FLRP runs its own gate/permissions).

# --------------------------------------------------------------------------
# 5b. Maps / MLOs (from flrp-maps, synced into resources/[maps]).
#     Every map below already declares `this_is_a_map` and ships its own
#     occlusion / deletion ymaps, so each self-replaces the stock GTA geometry.
#     The ONLY thing that causes the "double map" overlay here is loading TWO
#     maps that replace the SAME real-world spot — see the sheriff note below.
#     See docs/MAPS.md.
# --------------------------------------------------------------------------
# cfx-nteam-mapdata patches vanilla Mission Row (deletes the stock MRPD) so the
# nteam interior below replaces it cleanly. MUST load before cfx-nteam-mrpd.
# It lives in flrp-maps under the bracketed folder [MRPD]/cfx-nteam-mapdata.
ensure cfx-nteam-mapdata                  # vanilla MRPD delete patch (load first)
ensure cfx-nteam-mrpd                    # Mission Row PD interior  -> MPD HQ
ensure 25paletosheriff_ext_rsm           # Paleto sheriff station   -> BSO (north)
ensure 24paletobank_rsm_standalone       # Paleto bank
ensure ibonoja_senora_sheriff_station    # Senora freeway sheriff  -> BSO
ensure ibonoja_sa_training_center        # LEO training center / EVOC
ensure cfx-nteam-river                   # river / dam area
ensure meffle_yellowjack2                # Yellow Jack bar (Sandy Shores)

# --- Prompt Sandy maps. cfx_prompt_sandy_mapdata carries the patched vanilla
#     Sandy map that DELETES the original buildings + the sv_MapDataHandler the
#     Prompt maps check for, it MUST load before the two maps below.
#     NOTE: cfx_prompt_sandy_mapdata is the Vertex Hub build generated for the
#     maps we OWN (Marina+Sheriff+Hospital+Airfield+Firestation). If a Prompt
#     Sandy map is ever added or removed, regenerate it from the link the loader
#     prints at boot (vertex-hub.com/prompt/map-data/sandy-rework/...). A
#     mismatched mapdata flattens the footprints of maps that aren't installed,
#     which shows up as bare grey pads (e.g. by the Sandy sheriff station).
ensure cfx_prompt_sandy_mapdata          # patched vanilla Sandy map (removes originals)
ensure prompt_sandy_sheriff              # downtown Sandy vanilla station -> BSO
ensure prompt_sandy_hospital             # Sandy Shores hospital
ensure cfx_prompt_sandy_shores_fire_department  # Sandy fire station — mapdata deletes
                                         # the stock one, this MLO replaces it (Fire/EMS)
ensure prompt_sandy_airfield             # Sandy Shores airfield (Prompt)
ensure prompt_sandy_beaches              # Sandy marina / Alamo Sea beaches (Prompt)

# --- Bolingbroke prison complex (5 resources, designed to run together) ---
# DISABLED for now (FLRP): interiors don't open without ox_lib (prompt_prison_study
# logs "ox_lib not found ... static mode"). Re-enable these once ox_lib is added.
# ensure prompt_church_prison
# ensure prompt_prison_escape_dlc
# ensure prompt_bolingbroke_prison_interiors
# ensure prompt_prison_tower_23
# ensure prompt_prison_study

# NOTE: ibonoja_senora_sheriff_station (Senora freeway) and prompt_sandy_sheriff
#     (downtown Sandy vanilla station) are DIFFERENT locations, ibonoja is active,
#     prompt_sandy_sheriff is parked above pending its map data.
#
# NOTE: prompt_sandy_hospital (and prompt_sandy_sheriff) ship Prompt DRM loaders
#     (sv_Tokens.lua / sv_MapVersionCheck.lua / sv_loader.lua). They run
#     server-side and phone home to validate the purchase. If the console spams
#     token/version errors, the map wasn't pulled through the buyer's account.

# --------------------------------------------------------------------------
# 5d. EUP (from flrp-eup, synced into resources/[eup]/[flrp-eup]/[DEPT]/...)
# --------------------------------------------------------------------------
ensure fhp-eup            # FHP main + extras, /flrpfhp list and /fhpextra list.
ensure bso-eup            # Broward Sheriff main + extras, /bso list and /bsoextra list.
ensure mpd-eup            # Miami DLC addon collection, including the former vanilla replacements, /flrpmpd list.
ensure flrp-vests         # MP male Endeavor vests: /flrpvest fhp|bso|mpd [gear 0-8].
# Start one copy of each collection, do not also ensure the original JA/Endeavor resources.

# --------------------------------------------------------------------------
# 6. Assets (individual imports, see docs/ASSET_IMPORT.md)
# --------------------------------------------------------------------------
