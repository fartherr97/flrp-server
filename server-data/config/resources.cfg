# ==========================================================================
# FLRP :: config/resources.cfg — resource start order
# ==========================================================================
# Order matters. Dependencies -> core -> flrp services -> departments ->
# assets. FLRP resources declare `dependency`/`dependencies` in their
# fxmanifest, but explicit ordering here keeps boot deterministic.
#
# NOTE: [vehicles], [maps], [eup] are asset drop zones and are intentionally
# NOT ensured here yet — they are populated during asset import.
# See docs/ASSET_IMPORT.md.
# ==========================================================================

# --------------------------------------------------------------------------
# 1. Dependencies (installed per-host into [dependencies])
# --------------------------------------------------------------------------
ensure oxmysql

# --------------------------------------------------------------------------
# 2. Core community resources ([core]) — vMenu.
#    FLRP is self-contained: it runs its OWN Discord connection gate
#    (flrp_access) and permission engine (flrp_permissions). No pCore.
# --------------------------------------------------------------------------
# ensure vMenu            # <-- uncomment after vMenu is installed into [core]

# --------------------------------------------------------------------------
# 3. FLRP custom services (dependency order)
#    flrp_core must start first; everything else depends on it.
#    flrp_access runs the Discord-gated connection deferral and hands the
#    player's Discord roles to flrp_permissions.
# --------------------------------------------------------------------------
ensure flrp_core
ensure flrp_permissions
ensure flrp_access
ensure flrp_economy
ensure flrp_duty
ensure flrp_weapons
ensure flrp_vehicles
ensure flrp_gunstores
ensure flrp_api

# --------------------------------------------------------------------------
# 4. Departments (BCSO / FHP / MPD department-specific glue)
# --------------------------------------------------------------------------
# ensure flrp_bcso        # populated as department resources are built
# ensure flrp_fhp
# ensure flrp_mpd

# --------------------------------------------------------------------------
# 5. Content repos (multi-repo split — see docs/REPOSITORY_STRATEGY.md)
# --------------------------------------------------------------------------
# Content lives in separate repos (flrp-vehicles / flrp-eup / flrp-maps /
# flrp-<dept>), cloned into the [vehicles]/[eup]/[maps]/[departments] drop
# zones by deploy/assemble.sh. That script generates config/content.cfg, which
# execs each content repo's own content.cfg (its `ensure` lines). This exec is
# guarded: if content.cfg does not exist yet (before first assemble), FiveM
# logs a warning and continues.
exec config/content.cfg

# --------------------------------------------------------------------------
# 6. Assets (individual imports; see docs/ASSET_IMPORT.md)
# --------------------------------------------------------------------------
# ensure <vehicle_pack>     # only for one-off assets NOT in a content repo
# ensure <map_mlo>
# ensure <eup_pack>
