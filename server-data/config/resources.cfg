# NOTE: ibonoja_senora_sheriff_station (Senora freeway) and prompt_sandy_sheriff
#     (downtown Sandy vanilla station) are DIFFERENT locations despite the
#     naming, and run together fine (confirmed by FLRP). Both ensured above.
#
