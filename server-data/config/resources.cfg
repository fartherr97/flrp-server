#       never ensure pCore (dropped — FLRP runs its own gate/permissions);
#       ulc is not in the flrp-scripts repo (push it there to use it).

# --------------------------------------------------------------------------
# 5b. Content — vehicles / maps / departments / eup.
#     These repos are currently EMPTY on GitHub — the car/map assets live only
#     on the old Nodecraft host. Push them to flrp-vehicles / flrp-maps (with
#     Git LFS for the models) then add `ensure <resource>` lines here.
# --------------------------------------------------------------------------
# ensure HCSO21-24PPVSUVs                  # once flrp-vehicles is populated
# ensure cfx-nteam-mrpd                    # once flrp-maps is populated
# ensure ibonoja_senora_sheriff_station

