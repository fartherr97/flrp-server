# ==========================================================================
# FLRP :: config/local.cfg — DEV OVERRIDES (untracked)
# ==========================================================================
# Copy this to `local.cfg` (same folder). It is gitignored, so the autodeploy
# `git reset --hard` never reverts it — put dev `ensure` lines + convar tweaks
# here instead of editing the git-managed resources.cfg. Loaded LAST at boot.
#
#   cp local.example.cfg local.cfg
#
# Examples:
#   ensure my_test_resource
#   ensure some_map_pack
#   setr some_convar "value"
# ==========================================================================
