# ==========================================================================
# FLRP :: config/vehicles.cfg — vehicle system convars
# ==========================================================================
# The vehicle REGISTRY and vehicle PERMISSIONS live in the database
# (vehicles, vehicle_permissions) and are the runtime source of truth. This
# file only holds a few system-level toggles. The registry is intentionally
# EMPTY of real FLRP vehicles until asset import — see docs/VEHICLES.md and
# docs/ASSET_IMPORT.md.
# ==========================================================================

# Enforce vehicle spawn permissions server-side (authoritative). When true,
# flrp_vehicles validates every spawn request against the registry + the
# player's permissions before allowing it.
set flrp_vehicles_enforce_permissions true

# Allow spawning vehicles that are NOT in the FLRP registry (e.g. base-game
# civilian cars). When true, unlisted spawn names fall back to vMenu's own
# ace checks; when false, only registry-listed, permitted vehicles spawn.
set flrp_vehicles_allow_unlisted true        # DEV DEFAULT

# Auto-despawn department vehicles when a player goes off duty (optional).
set flrp_vehicles_despawn_offduty false      # DEV DEFAULT

# Registry cache TTL (seconds) before flrp_vehicles refreshes from DB.
set flrp_vehicles_cache_ttl 300
