# ==========================================================================
# FLRP :: config/secrets.example.cfg — SECRETS TEMPLATE
# ==========================================================================
# COPY this file to `secrets.cfg` (same directory) and fill in real values.
#   cp secrets.example.cfg secrets.cfg
#
# `secrets.cfg` is gitignored and MUST NEVER be committed. This example file
# contains ONLY placeholders (REPLACE_ME). Do not put real credentials here.
#
# All of these are set as PRIVATE convars (`set` at server scope). Discord
# bot tokens and DB connection strings must remain server-side and are never
# sent to clients. flrp_* resources read them with GetConvar server-side only.
# See docs/DISCORD_INTEGRATION.md and docs/SECURITY.md.
# ==========================================================================

# --------------------------------------------------------------------------
# FiveM license key (from https://keymaster.fivem.net) — host-specific
# --------------------------------------------------------------------------
sv_licenseKey "REPLACE_ME"

# --------------------------------------------------------------------------
# Database connection (oxmysql)
# Format: mysql://user:password@host:port/database?options
# --------------------------------------------------------------------------
set mysql_connection_string "REPLACE_ME"
# FLRP-scoped alias also read by flrp_core if present:
set flrp_database_connection "REPLACE_ME"

# --------------------------------------------------------------------------
# Discord — bot token + guild (server) for the membership gate
# The bot must be a member of the FLRP guild with the "Server Members
# Intent" enabled so it can read member roles. See docs/DISCORD_INTEGRATION.md.
# --------------------------------------------------------------------------
set flrp_discord_token "REPLACE_ME"
set flrp_discord_guild_id "REPLACE_ME"
set flrp_discord_invite_url "https://discord.gg/REPLACE_ME"

# --------------------------------------------------------------------------
# Discord ROLE IDs (placeholders — fill with real IDs, do NOT invent IDs)
# These drive FLRP group membership. Kept here (secret-adjacent, host-owned)
# so they can be rotated without touching tracked configs. Alternatively set
# them in permissions.cfg — but real IDs belong out of version control.
# --------------------------------------------------------------------------
set flrp_role_community_member "REPLACE_ME"   # required verification role
set flrp_role_ownership        "REPLACE_ME"
set flrp_role_director         "REPLACE_ME"
set flrp_role_administrator    "REPLACE_ME"
set flrp_role_moderator        "REPLACE_ME"
set flrp_role_cert_civ_1       "REPLACE_ME"
set flrp_role_cert_civ_2       "REPLACE_ME"
set flrp_role_cert_civ_3       "REPLACE_ME"
set flrp_role_bcso             "REPLACE_ME"
set flrp_role_fhp              "REPLACE_ME"
set flrp_role_mpd              "REPLACE_ME"

# --------------------------------------------------------------------------
# FLRP Manager (website) API — shared secret for the HTTP contract
# See docs/WEBSITE_INTEGRATION.md. flrp_api rejects requests without it.
# This secret authenticates INBOUND calls to flrp_api (incl. the site's
# POST /sync webhook).
# --------------------------------------------------------------------------
set flrp_api_shared_secret "REPLACE_ME"

# --------------------------------------------------------------------------
# Live config sync — florida-roleplay-site is the source of truth.
# flrp_api PULLS config from the site read API and re-applies live (no restart).
# See docs/LIVE_CONFIG_SYNC.md.
#   flrp_site_api_url    : base URL of the site (e.g. https://site.example)
#   flrp_site_api_secret : shared secret the site checks on GET /api/fivem/config
#   flrp_sync_interval_minutes : background reconcile cadence (default 10)
# --------------------------------------------------------------------------
set flrp_site_api_url "REPLACE_ME"
set flrp_site_api_secret "REPLACE_ME"
set flrp_sync_interval_minutes "10"

# --------------------------------------------------------------------------
# Optional: Steam Web API key (identity does NOT require Steam)
# --------------------------------------------------------------------------
# set steam_webApiKey "REPLACE_ME"
