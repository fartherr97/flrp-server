# ==========================================================================
# FLRP :: config/permissions.cfg — BASE ACE HIERARCHY
# ==========================================================================
# This file defines the STATIC base ACE hierarchy for FLRP groups and the
# vMenu permission mapping. It does NOT contain any individual player's
# Discord ID or license. Per-player group membership is assigned dynamically
# at runtime by flrp_permissions (driven by Discord roles). See
# docs/PERMISSIONS.md and docs/DISCORD_INTEGRATION.md.
#
# The FLRP group principals below are the stable "handles". flrp_permissions
# adds each connecting player to the correct group principals via
# `add_principal identifier.fivem:<id> group.flrp.<group>` at runtime, so we
# NEVER hand-edit this cfg to grant a specific person access.
# ==========================================================================

# --------------------------------------------------------------------------
# GROUP HIERARCHY (inheritance)
# --------------------------------------------------------------------------
# Higher groups inherit lower ones. Ownership sits at the top.
#
#   group.flrp.ownership
#     -> group.flrp.director
#       -> group.flrp.administrator
#         -> group.flrp.moderator
#           -> group.flrp.member          (base: any verified community member)
#
# Departments and certifications are PARALLEL groups (a player can hold
# several at once), not part of the staff inheritance chain.
# --------------------------------------------------------------------------

# Base membership — every verified community member.
add_ace group.flrp.member                 flrp.member                 allow

# Staff inheritance chain
add_principal group.flrp.moderator         group.flrp.member
add_principal group.flrp.administrator     group.flrp.moderator
add_principal group.flrp.director          group.flrp.administrator
add_principal group.flrp.ownership         group.flrp.director

# --------------------------------------------------------------------------
# STAFF CAPABILITIES (ACE)
# --------------------------------------------------------------------------
add_ace group.flrp.moderator               flrp.staff.moderate         allow
add_ace group.flrp.administrator           flrp.staff.administer       allow
add_ace group.flrp.director                flrp.staff.direct           allow
add_ace group.flrp.ownership               flrp.staff.own              allow

# Staff QoL (noclip etc.) — authoritative check still lives in flrp_permissions
add_ace group.flrp.moderator               flrp.staff.noclip           allow

# --------------------------------------------------------------------------
# CIVILIAN CERTIFICATION GROUPS (parallel)
# --------------------------------------------------------------------------
add_ace group.flrp.cert_civ_1              flrp.cert.civ1              allow
add_ace group.flrp.cert_civ_2              flrp.cert.civ2              allow
add_ace group.flrp.cert_civ_3              flrp.cert.civ3              allow

# --------------------------------------------------------------------------
# DEPARTMENT GROUPS (parallel)
# --------------------------------------------------------------------------
add_ace group.flrp.bcso                    flrp.dept.bcso             allow
add_ace group.flrp.fhp                     flrp.dept.fhp              allow
add_ace group.flrp.mpd                     flrp.dept.mpd             allow

# ==========================================================================
# vMENU INTEGRATION
# ==========================================================================
# vMenu reads ACE aces of the form `vMenu.<category>.<option>`. FLRP drives
# these through the FLRP group principals so we never list players here.
#
# IMPORTANT — WEAPON SPAWN POLICY (authoritative):
# Only these groups may spawn weapons directly through vMenu:
#   - cert_civ_3, director, ownership
# Everyone else must buy weapons through gun stores (flrp_gunstores).
#
# The line below maps the FLRP permission `weapon.vmenu.spawn` onto vMenu's
# weapon-spawn ace. It DEFAULTS TO DENY for everyone and is only allowed for
# the three authorized groups.
# --------------------------------------------------------------------------

# ---- vMenu: DENY weapon spawning to the general population ----------------
# vMenu grants weapon options via `vMenu.WeaponOptions.*` and
# `vMenu.WeaponSpawner.*`. We deny at the broadest scope, then allow only
# the three authorized groups. (Deny lines are authoritative in ACE.)
add_ace builtin.everyone                   vMenu.WeaponOptions.Spawn   deny
add_ace builtin.everyone                   vMenu.WeaponSpawner.Menu    deny
add_ace builtin.everyone                   vMenu.WeaponSpawner.All     deny

# ---- vMenu: ALLOW weapon spawning ONLY for authorized groups -------------
add_ace group.flrp.cert_civ_3              vMenu.WeaponSpawner.Menu    allow
add_ace group.flrp.cert_civ_3              vMenu.WeaponSpawner.All     allow
add_ace group.flrp.cert_civ_3              vMenu.WeaponOptions.Spawn   allow

add_ace group.flrp.director                vMenu.WeaponSpawner.Menu    allow
add_ace group.flrp.director                vMenu.WeaponSpawner.All     allow
add_ace group.flrp.director                vMenu.WeaponOptions.Spawn   allow

add_ace group.flrp.ownership               vMenu.WeaponSpawner.Menu    allow
add_ace group.flrp.ownership               vMenu.WeaponSpawner.All     allow
add_ace group.flrp.ownership               vMenu.WeaponOptions.Spawn   allow

# ---- vMenu: general vMenu access for all verified members ----------------
# (Menu access itself is fine for everyone; only weapon spawning is gated.)
add_ace group.flrp.member                  vMenu.Menu                  allow
add_ace group.flrp.member                  vMenu.PlayerOptions.Menu    allow
add_ace group.flrp.member                  vMenu.VehicleOptions.Menu   allow
add_ace group.flrp.member                  vMenu.VehicleSpawner.Menu   allow

# ---- vMenu: staff-only menu sections -------------------------------------
add_ace group.flrp.moderator               vMenu.OnlinePlayers.Menu    allow
add_ace group.flrp.administrator           vMenu.NoClip                allow
add_ace group.flrp.administrator           vMenu.MiscSettings.All      allow

# --------------------------------------------------------------------------
# FLRP mirror aces (so flrp_permissions can IsPrincipalAceAllowed-check)
# These mirror the authoritative weapon.vmenu.spawn permission into ACE.
# Default: DENY. Allow: cert_civ_3, director, ownership.
# --------------------------------------------------------------------------
add_ace builtin.everyone                   flrp.weapon.vmenu.spawn     deny
add_ace group.flrp.cert_civ_3              flrp.weapon.vmenu.spawn     allow
add_ace group.flrp.director                flrp.weapon.vmenu.spawn     allow
add_ace group.flrp.ownership               flrp.weapon.vmenu.spawn     allow

# ==========================================================================
# NOTES
# ==========================================================================
# * Do NOT add `add_principal identifier.fivem:<id> group.flrp.*` lines here
#   by hand. flrp_permissions does this at connect time from Discord roles.
# * The database (roles / role_permissions / discord_role_mappings) is the
#   source of truth for which FLRP group a Discord role maps to and what each
#   group may do. This cfg only declares the STABLE base hierarchy + vMenu map.
# * After vMenu is installed, verify these ace names against your vMenu
#   version's permissions.cfg reference. See docs/WEAPONS.md.
