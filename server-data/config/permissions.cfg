# ==========================================================================
# FLRP :: config/permissions.cfg — BASE ACE HIERARCHY
# ==========================================================================
# This file defines the STATIC base ACE hierarchy for FLRP groups and the
# vMenu permission mapping. It does NOT contain any individual player's
# Discord ID or license. Per-player group membership is assigned dynamically
# at runtime by flrp_permissions (driven by Discord roles). See
# docs/PERMISSIONS.md and docs/DISCORD_INTEGRATION.md.
#
# The FLRP group principals below are the stable "handles". flrp_permissions
# adds each connecting player to the correct group principals via
# `add_principal identifier.fivem:<id> group.flrp.<group>` at runtime, so we
# NEVER hand-edit this cfg to grant a specific person access.
# ==========================================================================

# --------------------------------------------------------------------------
# RUNTIME COMMAND GRANT (required)
# --------------------------------------------------------------------------
# flrp_permissions attaches each connecting player to their group.flrp.*
# principals by executing `add_principal` / `remove_principal` at runtime.
# FiveM guards those commands: a RESOURCE may only run them if its principal
# (resource.<name>) is granted the matching `command.*` ace. Without these two
# lines the server console logs "Access denied for command add_principal" and
# the dynamic vMenu/ACE weapon policy never attaches. This grants ONLY the two
# principal commands to ONLY flrp_permissions — not blanket command access.
add_ace resource.flrp_permissions command.add_principal    allow
add_ace resource.flrp_permissions command.remove_principal allow

# --------------------------------------------------------------------------
# GROUP HIERARCHY (inheritance)
# --------------------------------------------------------------------------
# Higher groups inherit lower ones. Ownership sits at the top.
#
#   group.flrp.ownership
#     -> group.flrp.director
#       -> group.flrp.administrator
#         -> group.flrp.moderator
#           -> group.flrp.member          (base: any verified community member)
#
# Departments and certifications are PARALLEL groups (a player can hold
# several at once), not part of the staff inheritance chain.
# --------------------------------------------------------------------------

# Base membership — every verified community member.
add_ace group.flrp.member                 flrp.member                 allow

# Staff inheritance chain
add_principal group.flrp.moderator         group.flrp.member
add_principal group.flrp.administrator     group.flrp.moderator
add_principal group.flrp.director          group.flrp.administrator
add_principal group.flrp.ownership         group.flrp.director

# --------------------------------------------------------------------------
# STAFF CAPABILITIES (ACE)
# --------------------------------------------------------------------------
add_ace group.flrp.moderator               flrp.staff.moderate         allow
add_ace group.flrp.administrator           flrp.staff.administer       allow
add_ace group.flrp.director                flrp.staff.direct           allow
add_ace group.flrp.ownership               flrp.staff.own              allow

# Staff QoL (noclip etc.) — authoritative check still lives in flrp_permissions
add_ace group.flrp.moderator               flrp.staff.noclip           allow

# --------------------------------------------------------------------------
# THIRD-PARTY RESOURCE ACCESS (ACE)
# --------------------------------------------------------------------------
# jg-handling: Config.EditorAdminOnly=true gates the /editor command on the
# `command.editor` ace. Grant it to Directors (Ownership inherits director) so
# only director+ can open the handling editor. Everyone else is denied.
add_ace group.flrp.director                command.editor              allow

# nex-hud management: /setaop, /priority, /peacetime and the /manage menu are
# gated on nexhud.manage.*. Grant to Administrators (Director/Ownership inherit)
# so admin+ can set AOP / priority / peacetime. Move to group.flrp.moderator if
# you want moderators to have it too.
add_ace group.flrp.administrator           nexhud.manage               allow
add_ace group.flrp.administrator           nexhud.manage.aop           allow
add_ace group.flrp.administrator           nexhud.manage.priority      allow
add_ace group.flrp.administrator           nexhud.manage.peacetime     allow

# flrp_onduty (FLRP's own duty system — nex-duty is retired):
#   Patrol      = flrp.dept.<id>              (every dept member already holds it, see below)
#   Supervisor  = flrp.rank.<id>.supervisor   (grant to a dept-supervisor group when you add one)
#   Command     = flrp.rank.<id>.command      (grant to a dept-command group when you add one)
#   Directors (flrp.staff.direct; Ownership inherits) get every dept + every rank.
# Examples once you have supervisor/command Discord roles mapped to groups:
# add_ace group.flrp.bso_supervisor  flrp.rank.bso.supervisor  allow
# add_ace group.flrp.bso_command     flrp.rank.bso.command     allow

# --------------------------------------------------------------------------
# CIVILIAN CERTIFICATION GROUPS (parallel)
# --------------------------------------------------------------------------
add_ace group.flrp.cert_civ_1              flrp.cert.civ1              allow
add_ace group.flrp.cert_civ_2              flrp.cert.civ2              allow
add_ace group.flrp.cert_civ_3              flrp.cert.civ3              allow

# --------------------------------------------------------------------------
# DONATOR GROUP
# --------------------------------------------------------------------------
# Gates the "Donator Vehicles" heading in the M interaction menu (flrp_interact)
# and is the recommended `required_permission` for donator vehicles in the
# flrp_vehicles registry. Map your donator Discord role to group.flrp.donator in
# the role->group config (flrp_access / flrp_permissions) so members inherit it.
add_ace group.flrp.donator                 flrp.donator                allow

# --------------------------------------------------------------------------
# DEPARTMENT GROUPS (parallel)
# --------------------------------------------------------------------------
add_ace group.flrp.bso                    flrp.dept.bso             allow
add_ace group.flrp.fhp                     flrp.dept.fhp              allow
add_ace group.flrp.mpd                     flrp.dept.mpd             allow

# Umbrella "any sworn law enforcement" ace — held by every BSO / FHP / MPD
# member. A single gate on `flrp.leo` (e.g. a police-station spawn point in
# nex-spawn) then allows all LEOs at once, while civilians are refused. This is
# a PERSISTENT membership ace applied at connection from the player's Discord
# role — not the transient on-duty ace — so it is already held when the spawn
# selector appears. For a department-only gate, use flrp.dept.bso/fhp/mpd.
add_ace group.flrp.bso                    flrp.leo                   allow
add_ace group.flrp.fhp                     flrp.leo                   allow
add_ace group.flrp.mpd                     flrp.leo                   allow

# ==========================================================================
# vMENU INTEGRATION
# ==========================================================================
# vMenu reads ACE aces of the form `vMenu.<category>.<option>`. FLRP drives
# these through the FLRP group principals so we never list players here.
#
# IMPORTANT — WEAPON SPAWN POLICY (authoritative):
# Only these groups may spawn weapons directly through vMenu:
#   - cert_civ_3, director, ownership
# Everyone else must buy weapons through gun stores (flrp_gunstores).
#
# The line below maps the FLRP permission `weapon.vmenu.spawn` onto vMenu's
# weapon-spawn ace. It DEFAULTS TO DENY for everyone and is only allowed for
# the three authorized groups.
# --------------------------------------------------------------------------

# ---- Enable vMenu's permission system (default OFF = everyone full admin) --
setr vmenu_use_permissions true

# ---- vMenu menu open key -> F1 -------------------------------------------
# M (244, vMenu's default) now belongs to the FLRP interaction menu
# (flrp_interact). Move vMenu's menu to F1 (control 288) so they don't both
# open on M. NoClip stays on F2 (289). Must be set before `ensure vMenu`
# (permissions.cfg execs before resources.cfg). Players can still rebind
# "vMenu Toggle Button" per-client in Settings > Key Bindings > FiveM.
setr vmenu_menu_toggle_key 288

# ---- vMenu About-menu branding (Florida Roleplay) ------------------------
setr vmenu_server_info_message "Florida Roleplay — Miami-based vMenu roleplay · BSO / FHP / MPD"
setr vmenu_server_info_website_url ""

# ---- Base menus for every verified member --------------------------------
# Only verified members pass the Discord gate, so builtin.everyone == verified.
# Granting the base here (not via FLRP groups) makes the menu work instantly,
# independent of when a player's group principals finish attaching.
add_ace builtin.everyone   vMenu.PlayerOptions.Menu        allow
add_ace builtin.everyone   vMenu.PlayerOptions.All         allow
add_ace builtin.everyone   vMenu.VehicleOptions.Menu       allow
add_ace builtin.everyone   vMenu.VehicleOptions.All        allow
add_ace builtin.everyone   vMenu.VehicleSpawner.Menu       allow
add_ace builtin.everyone   vMenu.VehicleSpawner.All        allow
add_ace builtin.everyone   vMenu.SavedVehicles.Menu        allow
add_ace builtin.everyone   vMenu.SavedVehicles.All         allow
add_ace builtin.everyone   vMenu.PersonalVehicle.Menu      allow
add_ace builtin.everyone   vMenu.PersonalVehicle.All       allow
add_ace builtin.everyone   vMenu.PlayerAppearance.Menu     allow
add_ace builtin.everyone   vMenu.PlayerAppearance.All      allow
add_ace builtin.everyone   vMenu.WeaponLoadouts.Menu       allow
add_ace builtin.everyone   vMenu.WeaponLoadouts.All        allow
add_ace builtin.everyone   vMenu.VoiceChat.Menu            allow
add_ace builtin.everyone   vMenu.VoiceChat.Enable          allow
add_ace builtin.everyone   vMenu.OnlinePlayers.Menu        allow
add_ace builtin.everyone   vMenu.OnlinePlayers.Teleport    allow
add_ace builtin.everyone   vMenu.OnlinePlayers.Waypoint    allow
add_ace builtin.everyone   vMenu.OnlinePlayers.Spectate    allow
add_ace builtin.everyone   vMenu.NoClip                    allow
# Misc settings has no master .Menu (some options must always be open):
add_ace builtin.everyone   vMenu.MiscSettings.TeleportToWp      allow
add_ace builtin.everyone   vMenu.MiscSettings.TeleportToCoord   allow
add_ace builtin.everyone   vMenu.MiscSettings.ShowCoordinates   allow
add_ace builtin.everyone   vMenu.MiscSettings.ShowLocation      allow
# Join/Quit chat notifs are handled by flrp_notify (custom nex-styled toasts),
# so deny vMenu's native ones to avoid doubling up. (Takes effect once the ACE
# grants in this file are actually applied — see the perms-loading note.)
add_ace builtin.everyone   vMenu.MiscSettings.JoinQuitNotifs    deny
add_ace builtin.everyone   vMenu.MiscSettings.DeathNotifs       allow
add_ace builtin.everyone   vMenu.MiscSettings.LocationBlips     allow
add_ace builtin.everyone   vMenu.MiscSettings.PlayerBlips       allow
add_ace builtin.everyone   vMenu.MiscSettings.OverheadNames     allow
add_ace builtin.everyone   vMenu.MiscSettings.ConnectionMenu    allow
add_ace builtin.everyone   vMenu.MiscSettings.RestoreAppearance allow
add_ace builtin.everyone   vMenu.MiscSettings.RestoreWeapons    allow

# ---- Weapon Options: menu open, but weapon SPAWNING is the gated exception -
# Real vMenu names (there is no "WeaponSpawner"). Deny the weapon-granting
# options for everyone, then allow only the authorized FLRP groups.
add_ace builtin.everyone       vMenu.WeaponOptions.Menu         allow
add_ace builtin.everyone       vMenu.WeaponOptions.All          deny
add_ace builtin.everyone       vMenu.WeaponOptions.Spawn        deny
add_ace builtin.everyone       vMenu.WeaponOptions.SpawnByName  deny
add_ace builtin.everyone       vMenu.WeaponOptions.GetAll       deny
add_ace group.flrp.cert_civ_3  vMenu.WeaponOptions.All          allow
add_ace group.flrp.cert_civ_3  vMenu.WeaponOptions.Spawn        allow
add_ace group.flrp.cert_civ_3  vMenu.WeaponOptions.SpawnByName  allow
add_ace group.flrp.cert_civ_3  vMenu.WeaponOptions.GetAll       allow

# ---- Staff-only sections (FLRP staff groups) -----------------------------
add_ace group.flrp.moderator      vMenu.OnlinePlayers.Summon            allow
add_ace group.flrp.moderator      vMenu.OnlinePlayers.Kill              allow
add_ace group.flrp.moderator      vMenu.OnlinePlayers.Kick              allow
add_ace group.flrp.moderator      vMenu.OnlinePlayers.TempBan           allow
add_ace group.flrp.moderator      vMenu.OnlinePlayers.ViewBannedPlayers allow
add_ace group.flrp.moderator      vMenu.TimeOptions.Menu                allow
add_ace group.flrp.moderator      vMenu.TimeOptions.All                 allow
add_ace group.flrp.moderator      vMenu.WeatherOptions.Menu             allow
add_ace group.flrp.moderator      vMenu.WeatherOptions.All              allow
add_ace group.flrp.moderator      vMenu.MiscSettings.EntitySpawner      allow
add_ace group.flrp.administrator  vMenu.OnlinePlayers.Identifiers       allow
add_ace group.flrp.administrator  vMenu.OnlinePlayers.PermBan           allow
add_ace group.flrp.administrator  vMenu.OnlinePlayers.Unban             allow
add_ace group.flrp.administrator  vMenu.MiscSettings.DevTools           allow

# ---- Director + Ownership: full menu (they are weapon-authorized too) -----
add_ace group.flrp.director    vMenu.Everything   allow
add_ace group.flrp.ownership   vMenu.Everything   allow

# --------------------------------------------------------------------------
# FLRP mirror aces (so flrp_permissions can IsPrincipalAceAllowed-check the
# authoritative weapon.vmenu.spawn permission). Default DENY, allow the three.
# --------------------------------------------------------------------------
add_ace builtin.everyone                   flrp.weapon.vmenu.spawn     deny
add_ace group.flrp.cert_civ_3              flrp.weapon.vmenu.spawn     allow
add_ace group.flrp.director                flrp.weapon.vmenu.spawn     allow
add_ace group.flrp.ownership               flrp.weapon.vmenu.spawn     allow

# ==========================================================================
# NOTES
# ==========================================================================
# * Do NOT add `add_principal identifier.fivem:<id> group.flrp.*` lines here
#   by hand. flrp_permissions does this at connect time from Discord roles.
# * The database (roles / role_permissions / discord_role_mappings) is the
#   source of truth for which FLRP group a Discord role maps to and what each
#   group may do. This cfg only declares the STABLE base hierarchy + vMenu map.
# * After vMenu is installed, verify these ace names against your vMenu
#   version's permissions.cfg reference. See docs/WEAPONS.md.
