# ==========================================================================
# FLRP :: config/permissions.cfg — pCore → FLRP role bridge
# ==========================================================================
# FLRP is built ON TOP OF pCore (see docs/PCORE_INTEGRATION.md). pCore owns the
# Discord gate, the queue, permission groups, and vMenu. When pCore resolves a
# player it runs `add_principal identifier.discord:<id> <group>` for each group
# the player holds, making the player's principal a child of that group.
#
# This file bridges pCore's group principals to FLRP role aces so that
# flrp_permissions can read a player's FLRP roles SYNCHRONOUSLY via
# IsPlayerAceAllowed(src, 'flrp.role.<key>') — no async calls into pCore and no
# edits to pCore. The DB `role_permissions` matrix still decides what each role
# may DO (economy.manage, weapon.gunstore.purchase, the website matrix).
#
# IMPORTANT: the left-hand group names below MUST match pCore's group names
# (configs/playerPerms.ts). They assume the FLRP pCore rebrand in
# integration/pcore/. If a pCore group is renamed, update it here AND in
# flrp_permissions/server/pcore.lua.
# ==========================================================================

# --------------------------------------------------------------------------
# pCore group principal  ->  FLRP role ace
# A player who is a child of the left principal is allowed the right ace.
# --------------------------------------------------------------------------
add_ace group.ownership      flrp.role.ownership      allow
add_ace group.director       flrp.role.director       allow
add_ace group.administrator  flrp.role.administrator  allow
add_ace group.moderator      flrp.role.moderator      allow
add_ace group.member         flrp.role.member         allow

add_ace certciv1             flrp.role.cert_civ_1     allow
add_ace certciv2             flrp.role.cert_civ_2     allow
add_ace certciv3             flrp.role.cert_civ_3     allow

add_ace bcso                 flrp.role.bcso           allow
add_ace fhp                  flrp.role.fhp            allow
add_ace mpd                  flrp.role.mpd            allow

# ==========================================================================
# NOTES
# ==========================================================================
# * NO player Discord IDs or licenses are listed here — pCore attaches each
#   player's principal to the right group(s) at runtime from Discord roles.
# * The vMenu weapon-spawn policy is NOT configured here anymore. pCore's
#   configs/weaponPerms.ts is the authority: only certciv3 (=> director,
#   ownership by inheritance) may vMenu-spawn weapons; everyone else buys at
#   FLRP gun stores. See docs/WEAPONS.md.
# * vMenu ACE in general is driven by pCore, not FLRP. flrp_permissions no
#   longer attaches vMenu principals.
