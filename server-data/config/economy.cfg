# ==========================================================================
# FLRP :: config/economy.cfg — economy convars (DEV DEFAULTS)
# ==========================================================================
# These are DEVELOPMENT DEFAULTS and are SUBJECT TO CHANGE. Do NOT treat any
# value here as a final production salary. The database `pay_rates` and
# `configuration` tables are the runtime source of truth (editable later via
# the FLRP Manager), these convars are only fallbacks used when a DB value is
# absent. See docs/ECONOMY.md.
#
# All money is in whole "dollars" (integer cents internally — see DATABASE.md).
# ==========================================================================

# --------------------------------------------------------------------------
# Pay interval
# --------------------------------------------------------------------------
# Hourly pay is distributed in smaller active-time chunks. With a 15-minute
# interval, a player is paid (hourly_rate / 4) every 15 ACTIVE minutes.
set flrp_pay_interval_minutes 15            # DEV DEFAULT — subject to change

# --------------------------------------------------------------------------
# Hourly pay rates by role (DEV DEFAULTS — placeholders, subject to change)
# --------------------------------------------------------------------------
# These are intentionally round placeholder numbers, NOT balanced values.
set flrp_pay_hourly_civilian    50          # DEV DEFAULT
set flrp_pay_hourly_cert_civ_1  75          # DEV DEFAULT
set flrp_pay_hourly_cert_civ_2  100         # DEV DEFAULT
set flrp_pay_hourly_cert_civ_3  125         # DEV DEFAULT
set flrp_pay_hourly_bso        150         # DEV DEFAULT (paid only while on BSO duty)
set flrp_pay_hourly_fhp         150         # DEV DEFAULT (paid only while on FHP duty)
set flrp_pay_hourly_mpd         150         # DEV DEFAULT (paid only while on MPD duty)

# --------------------------------------------------------------------------
# Starting balance for a brand-new FLRP player (DEV DEFAULT)
# --------------------------------------------------------------------------
set flrp_economy_starting_balance 500       # DEV DEFAULT

# --------------------------------------------------------------------------
# Anti-AFK / active playtime
# --------------------------------------------------------------------------
# A player must show activity within this window to be "active" (compensated).
set flrp_afk_timeout_seconds 300            # 5 minutes with no input => AFK
# Grace after (re)spawn before pay accrual can begin.
set flrp_active_spawn_grace_seconds 30
# Whether a fully-loaded but idle player still accrues pay (default: no).
set flrp_pay_requires_active true

# --------------------------------------------------------------------------
# Safety rails
# --------------------------------------------------------------------------
set flrp_economy_max_balance 100000000      # hard ceiling, sanity guard
set flrp_economy_min_balance 0              # no negative balances by default
